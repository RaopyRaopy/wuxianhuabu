server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # /assets is also Vite's static asset directory, so route the SPA page explicitly.
    location = /assets {
        try_files /index.html =404;
    }

    location = /assets/ {
        return 301 /assets;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
